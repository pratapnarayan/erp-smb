name: Quality Checks
on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  # ── File hygiene ─────────────────────────────────────────────────────────────
  bom-escapes-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check BOMs and escaped quotes (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x infrastructure/scripts/check_bom_and_escapes.sh
          ./infrastructure/scripts/check_bom_and_escapes.sh
      - name: Check BOMs and escaped quotes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./infrastructure/scripts/check_bom_and_escapes.ps1

  # ── Backend compile check ─────────────────────────────────────────────────────
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Compile only — skip tests and Flyway (requires a running DB)
      - name: Compile all modules
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests compile

  # ── Frontend build check ──────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite production build)
        run: npm run build
