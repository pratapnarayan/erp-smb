server:
  port: 8087
spring:
  application:
    name: hrms-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:erp}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: hrms
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: hrms
    default-schema: hrms
    locations: classpath:db/migration
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl: 3600
