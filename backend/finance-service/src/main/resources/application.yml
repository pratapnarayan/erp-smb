server:
  port: 8086
spring:
  application:
    name: finance-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:erp}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: finance
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    schemas: finance
    default-schema: finance
    locations: classpath:db/migration
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl: 3600
  services:
    # Base URLs used by FinanceKpiService to call read-only aggregate endpoints.
    # In docker-compose, service names resolve via the docker network.
    orders-base-url: ${ORDERS_SERVICE_BASE_URL:http://order-service:8084}
    products-base-url: ${PRODUCTS_SERVICE_BASE_URL:http://product-service:8083}
